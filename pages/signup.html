<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – Burger King</title>
  <link rel="icon" type="image/png" href="../images/iconlogo.png" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <a href="../index.html" class="back-home">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../images/iconlogo.png" alt="Burger King" />
      <span>Burger <em>King</em></span>
    </div>

    <h2>Create Account</h2>
    <p class="subtitle">Join the Burger King family today</p>

    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter a username" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="new-password" />
        <span class="input-hint">At least 6 characters</span>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your password" required autocomplete="new-password" />
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
    </form>

    <div class="auth-links">
      <a href="login.html">Already have an account? <span class="highlight">Login</span></a>
    </div>
  </div>

  <div class="toast"></div>
  <script src="../js/auth.js"></script>
</body>
</html>
