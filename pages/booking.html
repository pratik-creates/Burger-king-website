<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Table – Burger King</title>
  <link rel="icon" type="image/png" href="../images/iconlogo.png" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .auth-card { max-width: 520px; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>

  <a href="../index.html" class="back-home">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../images/iconlogo.png" alt="Burger King" />
      <span>Burger <em>King</em></span>
    </div>

    <h2>Book a Table</h2>
    <p class="subtitle">Reserve your spot for an unforgettable meal</p>

    <form id="bookingForm" novalidate>
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date" required />
        </div>
        <div class="form-group">
          <label for="time">Time</label>
          <input type="time" id="time" required />
        </div>
      </div>

      <div class="form-group">
        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" min="1" max="20" placeholder="Enter number of guests" required />
      </div>

      <div class="form-group">
        <label for="notes">Special Requests (optional)</label>
        <input type="text" id="notes" placeholder="Enter any special requests" />
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-calendar-check"></i> Confirm Booking
      </button>
    </form>

    <div class="auth-links">
      <a href="../index.html">Back to Home</a>
      <a href="menu.html" class="highlight">View Menu</a>
    </div>
  </div>

  <div class="toast"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Set min date to today
      const dateInput = document.getElementById('date');
      if (dateInput) {
        dateInput.min = new Date().toISOString().split('T')[0];
      }

      document.getElementById('bookingForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name   = document.getElementById('name').value.trim();
        const email  = document.getElementById('email').value.trim();
        const date   = document.getElementById('date').value;
        const time   = document.getElementById('time').value;
        const guests = document.getElementById('guests').value;

        if (!name || !email || !date || !time || !guests) {
          showToast('Please fill in all required fields.', 'error');
          return;
        }

        showToast(`🎉 Table booked for ${name}! See you on ${date} at ${time}.`, 'success');
        e.target.reset();
      });
    });

    function showToast(message, type = '') {
      const toast = document.querySelector('.toast');
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), 4000);
    }
  </script>
</body>
</html>
