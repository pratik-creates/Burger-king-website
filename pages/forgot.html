<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – Burger King</title>
  <link rel="icon" type="image/png" href="../images/iconlogo.png" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <a href="login.html" class="back-home">
    <i class="fas fa-arrow-left"></i> Back to Login
  </a>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../images/iconlogo.png" alt="Burger King" />
      <span>Burger <em>King</em></span>
    </div>

    <h2>Reset Password</h2>
    <p class="subtitle">Enter your email and choose a new password</p>

    <form id="forgotForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password" required autocomplete="new-password" />
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password" />
        <span class="error-msg" id="passwordError"></span>
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-key"></i> Reset Password
      </button>
    </form>

    <div class="auth-links">
      <a href="login.html">Remembered it? <span class="highlight">Login</span></a>
    </div>
  </div>

  <div class="toast"></div>
  <script src="../js/auth.js"></script>
</body>
</html>
