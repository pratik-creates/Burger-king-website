<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Burger King</title>
  <link rel="icon" type="image/png" href="../images/iconlogo.png" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <a href="../index.html" class="back-home">
    <i class="fas fa-arrow-left"></i> Back to Home
  </a>

  <div class="auth-card">
    <div class="auth-logo">
      <img src="../images/iconlogo.png" alt="Burger King" />
      <span>Burger <em>King</em></span>
    </div>

    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to your account to continue</p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>

    <div class="auth-links">
      <a href="forgot.html">Forgot Password?</a>
      <a href="signup.html" class="highlight">Create an Account</a>
    </div>
  </div>

  <div class="toast"></div>
  <script src="../js/auth.js"></script>
</body>
</html>
